name: CD

# Solo corre cuando CI termina en verde sobre main (o manualmente).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_training:
        description: "Ejecutar el pipeline de CT en dev después del deploy (test de integración)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy bundle -> dev
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    outputs:
      configured: ${{ steps.creds.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - id: creds
        name: Verificar credenciales
        run: |
          if [ -z "$DATABRICKS_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin secretos de Databricks: se omite el despliegue."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate + deploy (dev)
        if: steps.creds.outputs.configured == 'true'
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev --var="git_sha=${GITHUB_SHA::7}"
      - name: Test de integración (CT en dev)
        if: steps.creds.outputs.configured == 'true' && inputs.run_training
        run: databricks bundle run -t dev ct_training_pipeline --params trigger=ci,optuna_trials=2

  integration-staging:
    name: Gate de integración en staging (CT + monitoreo + trazabilidad)
    needs: deploy-dev
    if: needs.deploy-dev.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: staging
    # Un solo run de staging a la vez: comparte esquema, modelo y cuota de Free Edition.
    concurrency:
      group: databricks-staging
      cancel-in-progress: false
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Deploy (staging, schedules pausados)
        run: |
          databricks bundle validate -t staging
          databricks bundle deploy -t staging --var="git_sha=${GITHUB_SHA::7}"
      # `bundle run` espera a que termine y devuelve error si el job falla: es el test de integración.
      - name: CT completo con datos sintéticos (Bronze -> Silver -> Gold -> train -> validación)
        run: databricks bundle run -t staging ct_training_pipeline --params trigger=ci,optuna_trials=2,source=synthetic
      - name: Monitoreo + A/B sobre el replay (2 meses)
        run: databricks bundle run -t staging production_monitoring --params months=2
      - name: Smoke check de trazabilidad (código + versión Delta de datos)
        run: |
          pip install --quiet "mlflow-skinny>=3.1"
          python tests/e2e/smoke_check.py --model workspace.credit_risk_staging.credit_default_model

  deploy-prod:
    name: Deploy bundle + Databricks Apps -> prod
    needs: [deploy-dev, integration-staging]
    if: needs.deploy-dev.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: prod   # activa "Required reviewers" en GitHub para aprobar cada promoción
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy (prod)
        run: databricks bundle deploy -t prod --var="git_sha=${GITHUB_SHA::7}" --var="warehouse_id=${WAREHOUSE_ID}"
      - name: Desplegar y arrancar las apps (API + dashboard)
        run: |
          databricks bundle run -t prod credit_risk_api
          databricks bundle run -t prod credit_risk_dashboard
