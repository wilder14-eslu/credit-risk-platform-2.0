name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint y formato (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6"
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[ml,apps,dev]"
      - name: Pytest + cobertura
        run: pytest -p no:warnings --cov --cov-report=term --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          print(f"### Cobertura: {float(ET.parse('coverage.xml').getroot().get('line-rate')) * 100:.1f}%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            junit.xml

  e2e:
    name: Pipeline end-to-end (jobs de Databricks en local)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[ml,apps,dev]"
      - name: Ingesta -> entrenamiento -> Model Serving -> replay -> monitoreo -> A/B -> CT
        run: python tests/e2e/run_pipeline_locally.py --rows 60000 | tee e2e.log
      - name: Resumen
        if: always()
        run: |
          echo '### Pipeline end-to-end' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Resumen del monitoreo/,$p' e2e.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  bundle:
    name: Validar Databricks Asset Bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Sintaxis YAML
        run: python -c "import yaml; [yaml.safe_load(open(f)) for f in ('databricks.yml','resources/jobs.yml','apps/api/app.yaml','apps/dashboard/app.yaml')]; print('YAML OK')"
      - name: Validación contra el workspace (dev)
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev
