name: Demo en Hugging Face

# Publica el modelo champion de producción en el Space público (manual: después de
# un reentrenamiento que cambió el champion, o cuando cambie la app de la demo).
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Alias del modelo en Unity Catalog"
        default: champion

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: false

jobs:
  publish:
    name: Exportar champion y subir al Space
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verificar configuración
        run: |
          for v in DATABRICKS_HOST DATABRICKS_TOKEN HF_TOKEN HF_SPACE; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v (secret o variable del repo)"; exit 1; fi
          done
      - name: Instalar
        run: pip install -e ".[ml]" plotly gradio huggingface_hub
      - name: Construir el Space (descarga el champion y prueba una predicción)
        run: python scripts/build_hf_space.py --alias "${{ inputs.alias }}" --python-version 3.12
      - name: Subir al Space
        run: hf upload "$HF_SPACE" build/hf_space . --repo-type space --commit-message "Champion ${GITHUB_SHA::7}"
