# Databricks App: panel Streamlit (scoring + monitoreo).
command: ["streamlit", "run", "app.py"]
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: SERVING_ENDPOINT
    value: credit-risk-lc-endpoint
  - name: UC_CATALOG
    value: workspace
  - name: UC_SCHEMA
    value: credit_risk
  - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
    value: "false"
