[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-platform"
version = "2.0.0"
description = "Riesgo crediticio (Lending Club 2007-2018) con MLOps nivel 2 sobre Databricks Free Edition"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wilder Espinoza Luna" }]
license = { text = "MIT" }
dependencies = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "pyyaml>=6.0", "joblib>=1.3"]

[project.optional-dependencies]
ml = ["xgboost>=2.0", "lightgbm>=4.3", "catboost>=1.2", "optuna>=3.6", "mlflow>=3.1"]
apps = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "databricks-sdk>=0.40", "streamlit>=1.38", "plotly>=5.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "duckdb>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "apps/api", "apps/dashboard"]
extend-exclude = [".venv", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"jobs/*.py" = ["E402", "I001"]
"tests/*.py" = ["B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/credit_risk", "apps/api"]
omit = ["src/credit_risk/lakehouse.py", "src/credit_risk/registry/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
